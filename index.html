<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minos - AI Powered by GPT-OSS 120B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --bg-secondary: #141414;
  --bg-tertiary: #1a1a1a;
  --border: #262626;
  --text: #e5e5e5;
  --text-muted: #737373;
  --accent: #10b981;
  --accent-hover: #059669;
  --danger: #ef4444;
  --radius: 12px;
  --sidebar-width: 280px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
}
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.2s;
}
.sidebar.collapsed { width: 60px; }
.sidebar.collapsed .sidebar-text, .sidebar.collapsed .chat-item span, .sidebar.collapsed .new-chat-btn span, .sidebar.collapsed .settings-btn span { display: none; }
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), #059669);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.new-chat-btn {
  margin: 12px 16px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s;
}
.new-chat-btn:hover { background: var(--bg-tertiary); }
.chat-list { flex: 1; overflow-y: auto; padding: 0 12px; }
.chat-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 2px;
  transition: all 0.15s;
}
.chat-item:hover { background: var(--bg-tertiary); color: var(--text); }
.chat-item.active { background: var(--bg-tertiary); color: var(--text); }
.chat-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
.chat-item .delete-btn {
  opacity: 0;
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; padding: 2px; border-radius: 4px;
}
.chat-item:hover .delete-btn { opacity: 1; }
.chat-item .delete-btn:hover { color: var(--danger); }
.settings-btn {
  margin: 12px 16px;
  padding: 10px 14px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  transition: all 0.15s;
}
.settings-btn:hover { background: var(--bg-tertiary); color: var(--text); }
.collapse-btn {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; padding: 4px; border-radius: 6px;
}
.collapse-btn:hover { background: var(--bg-tertiary); color: var(--text); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.messages { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.empty-state {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}
.empty-state h1 { font-size: 42px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.empty-state p { font-size: 16px; max-width: 400px; text-align: center; }
.message { padding: 24px 0; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.message.user { background: var(--bg); }
.message.assistant { background: rgba(16, 185, 129, 0.03); }
.message-inner {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  gap: 16px;
}
.message-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 14px; font-weight: 600;
}
.message.user .message-avatar { background: var(--text); color: var(--bg); }
.message.assistant .message-avatar { background: var(--accent); color: white; }
.message-content { flex: 1; min-width: 0; line-height: 1.7; font-size: 15px; }
.message-content p { margin-bottom: 12px; }
.message-content p:last-child { margin-bottom: 0; }
.message-content pre {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  overflow-x: auto;
  margin: 12px 0;
  position: relative;
}
.message-content code { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.message-content pre code { background: none; padding: 0; }
.message-content :not(pre) > code {
  background: var(--bg-tertiary);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
.message-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
.message-content th, .message-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.message-content th { background: var(--bg-tertiary); font-weight: 600; }
.message-content ul, .message-content ol { margin: 12px 0; padding-left: 24px; }
.message-content li { margin: 4px 0; }
.message-content h1, .message-content h2, .message-content h3 { margin: 20px 0 12px; font-weight: 600; }
.message-content h1 { font-size: 22px; }
.message-content h2 { font-size: 18px; }
.message-content h3 { font-size: 16px; }
.message-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; margin: 12px 0; color: var(--text-muted); }
.message-content a { color: var(--accent); text-decoration: none; }
.message-content a:hover { text-decoration: underline; }
.code-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.code-lang { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 500; }
.copy-btn {
  background: none; border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  display: flex; align-items: center; gap: 4px;
}
.copy-btn:hover { color: var(--text); }
.streaming-cursor {
  display: inline-block;
  width: 8px; height: 18px;
  background: var(--accent);
  margin-left: 4px;
  animation: blink 1s infinite;
  vertical-align: middle;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.input-area { border-top: 1px solid var(--border); background: var(--bg); padding: 16px 24px; }
.input-wrapper { max-width: 800px; margin: 0 auto; position: relative; }
.input-wrapper textarea {
  width: 100%;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 48px 14px 16px;
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  resize: none;
  outline: none;
  min-height: 52px;
  max-height: 200px;
}
.input-wrapper textarea:focus { border-color: var(--accent); }
.input-wrapper textarea::placeholder { color: var(--text-muted); }
.input-wrapper textarea:disabled { opacity: 0.5; }
.send-btn {
  position: absolute;
  right: 12px;
  bottom: 12px;
  background: var(--accent);
  border: none;
  color: white;
  width: 32px; height: 32px;
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { background: var(--bg-tertiary); color: var(--text-muted); cursor: not-allowed; }
.input-hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 480px;
  padding: 24px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
.form-group input, .form-group textarea {
  width: 100%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
.btn-secondary { background: var(--bg-tertiary); color: var(--text); border: 1px solid var(--border) !important; }
.btn-secondary:hover { background: var(--border); }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
@media (max-width: 768px) {
  .sidebar { position: fixed; z-index: 50; height: 100vh; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .message-inner { padding: 0 16px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch { return d } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};
const DEFAULT_SETTINGS = {
  apiKey: '',
  apiEndpoint: 'https://integrate.api.nvidia.com/v1/chat/completions',
  model: 'openai/gpt-oss-120b',
  temperature: 0.7,
  maxTokens: 4096,
  systemPrompt: 'You are Minos, a helpful AI assistant powered by GPT-OSS 120B via NVIDIA API. You provide detailed, accurate, and thoughtful responses.',
};
let state = {
  conversations: STORAGE.get('minos_conversations', []),
  currentId: localStorage.getItem('minos_current') || null,
  settings: { ...DEFAULT_SETTINGS, ...STORAGE.get('minos_settings', {}) },
  isLoading: false,
  showSettings: false,
  sidebarCollapsed: false,
};
function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 9); }
function saveState() {
  STORAGE.set('minos_conversations', state.conversations);
  localStorage.setItem('minos_current', state.currentId || '');
  STORAGE.set('minos_settings', state.settings);
}
function mdToHtml(text) {
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```(\w+)?\n([\s\S]*?)```/g, (m, lang, code) => {
      const language = lang || 'text';
      const cleanCode = code.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
      return `<div class="code-block" data-lang="${language}"><div class="code-header"><span class="code-lang">${language}</span><button class="copy-btn" onclick="copyCode(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button></div><pre><code>${cleanCode}</code></pre></div>`;
    })
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/(\|[^\n]+\|\n\|[-:\s|]+\|\n)(\|[^\n]+\|\n?)+/g, (m) => {
      const lines = m.trim().split('\n');
      let out = '<table>';
      lines.forEach((line, i) => { if (i === 1) return; const cells = line.split('|').filter(c => c.trim()); const tag = i === 0 ? 'th' : 'td'; out += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>'; });
      return out + '</table>';
    })
    .replace(/(^|\n)((\s*)-\s+.+?\n?)+/g, (m) => {
      const items = m.trim().split('\n').map(l => l.replace(/^\s*-\s+/, ''));
      return '<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
    })
    .replace(/(^|\n)((\s*)\d+\.\s+.+?\n?)+/g, (m) => {
      const items = m.trim().split('\n').map(l => l.replace(/^\s*\d+\.\s+/, ''));
      return '<ol>' + items.map(i => `<li>${i}</li>`).join('') + '</ol>';
    })
    .split('\n\n').map(p => {
      p = p.trim();
      if (!p || p.startsWith('<')) return p;
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');
  return html;
}
function copyCode(btn) {
  const code = btn.closest('.code-block').querySelector('code').innerText;
  navigator.clipboard.writeText(code);
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
  setTimeout(() => { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy'; }, 2000);
}
function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function scrollToBottom() { const el = document.getElementById('messages'); if (el) el.scrollTop = el.scrollHeight; }
function autoResize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; }
function handleKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function toggleSidebar() { state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
function newChat() {
  const conv = { id: genId(), title: 'New Chat', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  state.conversations.push(conv); state.currentId = conv.id;
  saveState(); render();
}
function selectChat(id) { state.currentId = id; saveState(); render(); }
function deleteChat(id) {
  state.conversations = state.conversations.filter(c => c.id !== id);
  if (state.currentId === id) state.currentId = null;
  saveState(); render();
}
function openSettings() { state.showSettings = true; render(); }
function closeSettings() { state.showSettings = false; render(); }
function saveSettings() {
  state.settings = {
    apiKey: document.getElementById('s-apiKey').value,
    apiEndpoint: document.getElementById('s-endpoint').value,
    model: document.getElementById('s-model').value,
    temperature: parseFloat(document.getElementById('s-temp').value),
    maxTokens: parseInt(document.getElementById('s-tokens').value),
    systemPrompt: document.getElementById('s-prompt').value,
  };
  saveState(); closeSettings();
}
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const content = input.value.trim();
  if (!content || state.isLoading) return;
  if (!state.settings.apiKey) { alert('Add your NVIDIA API key in Settings first.'); return; }
  let conv = state.conversations.find(c => c.id === state.currentId);
  if (!conv) {
    conv = { id: genId(), title: content.slice(0, 40) + (content.length > 40 ? '...' : ''), messages: [], createdAt: Date.now(), updatedAt: Date.now() };
    state.conversations.push(conv); state.currentId = conv.id;
  }
  conv.messages.push({ id: genId(), role: 'user', content, timestamp: Date.now() });
  if (conv.messages.length === 1) conv.title = content.slice(0, 40) + (content.length > 40 ? '...' : '');
  const assistantMsg = { id: genId(), role: 'assistant', content: '', timestamp: Date.now(), isStreaming: true };
  conv.messages.push(assistantMsg); conv.updatedAt = Date.now();
  saveState(); input.value = ''; input.style.height = 'auto'; state.isLoading = true; render();
  try {
    const apiMessages = [
      { role: 'system', content: state.settings.systemPrompt },
      ...conv.messages.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }))
    ];
    const res = await fetch(state.settings.apiEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.settings.apiKey}` },
      body: JSON.stringify({ model: state.settings.model, messages: apiMessages, stream: true, temperature: state.settings.temperature, max_tokens: state.settings.maxTokens })
    });
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          const delta = parsed.choices?.[0]?.delta?.content;
          if (delta) { fullContent += delta; assistantMsg.content = fullContent; saveState(); render(); }
        } catch (e) {}
      }
    }
    assistantMsg.isStreaming = false; saveState();
  } catch (err) {
    assistantMsg.content = 'Error: ' + (err.message || 'Failed to get response');
    assistantMsg.isStreaming = false; saveState();
  } finally { state.isLoading = false; render(); }
}
function render() {
  const app = document.getElementById('app');
  const current = state.conversations.find(c => c.id === state.currentId);
  app.innerHTML = `
    <div class="sidebar ${state.sidebarCollapsed ? 'collapsed' : ''}">
      <div class="sidebar-header">
        <div class="logo"><div class="logo-icon">M</div><span class="sidebar-text">Minos</span></div>
        <button class="collapse-btn" onclick="toggleSidebar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="${state.sidebarCollapsed ? '9 18 15 12 9 6' : '15 18 9 12 15 6'}"/></svg>
        </button>
      </div>
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span class="sidebar-text">New Chat</span>
      </button>
      <div class="chat-list">
        ${state.conversations.sort((a,b) => b.updatedAt - a.updatedAt).map(c => `
          <div class="chat-item ${c.id === state.currentId ? 'active' : ''}" onclick="selectChat('${c.id}')">
            <span>${escapeHtml(c.title)}</span>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${c.id}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        `).join('')}
      </div>
      <button class="settings-btn" onclick="openSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.67 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.67 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.67a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.33 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="sidebar-text">Settings</span>
      </button>
    </div>
    <div class="main">
      <div class="messages" id="messages">
        ${!current || current.messages.length === 0 ? `
          <div class="empty-state"><h1>Minos</h1><p>Powered by NVIDIA API with openai/gpt-oss-120b. Start a conversation below.</p></div>
        ` : current.messages.map(m => `
          <div class="message ${m.role}">
            <div class="message-inner">
              <div class="message-avatar">${m.role === 'user' ? 'You' : 'AI'}</div>
              <div class="message-content">${m.role === 'user' ? escapeHtml(m.content).replace(/\\n/g, '<br>') : mdToHtml(m.content)}${m.isStreaming ? '<span class="streaming-cursor"></span>' : ''}</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="chatInput" rows="1" placeholder="${state.settings.apiKey ? 'Message Minos...' : 'Add your NVIDIA API key in Settings...'}" onkeydown="handleKeyDown(event)" oninput="autoResize(this)" ${state.settings.apiKey ? '' : 'disabled'}></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" ${state.isLoading ? 'disabled' : ''}>
            ${state.isLoading ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>'}
          </button>
        </div>
        <p class="input-hint">Minos can make mistakes. Consider checking important information.</p>
      </div>
    </div>
    ${state.showSettings ? `
      <div class="modal-overlay" onclick="if(event.target===this)closeSettings()">
        <div class="modal">
          <h2>Settings</h2>
          <div class="form-group"><label>NVIDIA API Key</label><input type="password" id="s-apiKey" value="${state.settings.apiKey}" placeholder="nvapi-..."></div>
          <div class="form-group"><label>API Endpoint</label><input type="text" id="s-endpoint" value="${state.settings.apiEndpoint}"></div>
          <div class="form-group"><label>Model</label><input type="text" id="s-model" value="${state.settings.model}"></div>
          <div class="form-row">
            <div class="form-group"><label>Temperature</label><input type="number" id="s-temp" min="0" max="2" step="0.1" value="${state.settings.temperature}"></div>
            <div class="form-group"><label>Max Tokens</label><input type="number" id="s-tokens" value="${state.settings.maxTokens}"></div>
          </div>
          <div class="form-group"><label>System Prompt</label><textarea id="s-prompt">${state.settings.systemPrompt}</textarea></div>
          <div class="modal-actions"><button class="btn-secondary" onclick="closeSettings()">Cancel</button><button class="btn-primary" onclick="saveSettings()">Save</button></div>
        </div>
      </div>
    ` : ''}
  `;
  scrollToBottom();
}
render();
</script>
</body>
</html>
